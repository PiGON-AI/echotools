name: Report a problem
description: Something in EchoVoice, EchoAvatar, EchoMemory or the site isn't working the way it should
labels: [bug]

# DO NOT RENAME THE `id:` VALUES BELOW. The extensions' "Report a problem"
# doors open this form with fields prefilled by passing query parameters that
# match these ids exactly (the same ids the EchoVoice form used). Change a
# LABEL freely; change an `id` only together with the extensions' report URLs.
# `product` and `editor` are dropdowns: a prefilled value must match an option.

body:
  - type: dropdown
    id: product
    attributes:
      label: Which part of EchoTools?
      options: [EchoVoice, EchoAvatar, EchoMemory, echotools.dev, Not sure]
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Extension version, placeholder: "e.g. 1.1.0 - the Extensions panel shows it"}
    validations: {required: true}
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [VS Code, Antigravity, Cursor, Other]
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Operating system, placeholder: "Windows 11 / macOS 26 (Apple Silicon) / Ubuntu 24"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What you did, what you expected, what happened instead."}
    validations: {required: true}
  - type: textarea
    id: log
    attributes: {label: "Output log (View > Output > pick the extension)", description: "Paste the relevant lines; the log narrates every decision and usually names the cause.", render: text}
